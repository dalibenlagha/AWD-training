# Service
# The name in Eureka comes from spring.application.name (shown as JOB in the dashboard)
spring.application.name=job
server.port=8082

# Eureka registration
# URL of the Eureka server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# register this service in Eureka (heartbeat every 30 s)
eureka.client.register-with-eureka=true
# download the list of the other services and keep it in a local cache
eureka.client.fetch-registry=true

#DataSource - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/job_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA
# The schema is created by database/job_db.sql, so Hibernate does not touch it.
# Use "update" instead if you want Hibernate to create/alter the tables itself.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

#Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
