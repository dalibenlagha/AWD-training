# Service
# The name in Eureka comes from spring.application.name (shown as CANDIDAT in the dashboard)
spring.application.name=candidat
server.port=8081

# Eureka registration
# URL of the Eureka server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# register this service in Eureka (heartbeat every 30 s)
eureka.client.register-with-eureka=true
# download the list of the other services and keep it in a local cache
eureka.client.fetch-registry=true

#H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2
#DataSource
spring.datasource.username=Badia
spring.datasource.password=
#spring.datasource.url=jdbc:h2:file:./Database/Data/Candidat
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create

#Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
